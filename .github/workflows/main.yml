name: Docker Build and Push

on:
  push:
    branches: [ "dev" ] # Or your main development branch
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and Push Docker Image
        id: docker-build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            billgates98/agrold-vue-frontend:latest
            billgates98/agrold-vue-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BillGates98/agrold-vue-frontend
            org.opencontainers.image.description="Vue version of Agrold"
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.authors="Bill Gates Happi Happi, PhD"
            org.opencontainers.image.licenses=MIT

      - name: Image Digest
        if: steps.docker-build-push.outputs.digest
        run: echo "Image digest }}"
